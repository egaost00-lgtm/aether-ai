  />

  <!-- ASHOKA CHAKRA -->
  <g transform="translate(720 405)" fill="none" stroke="#000080">

    <circle
      r="105"
      stroke-width="9"
    />

    <circle
      r="15"
      fill="#000080"
      stroke="none"
    />

    <!-- 24 spokes -->
    <g stroke-width="5">
      <line x1="0" y1="-18" x2="0" y2="-98"/>
      <line x1="0" y1="-18" x2="0" y2="-98" transform="rotate(15)"/>
      <line x1="0" y1="-18" x2="0" y2="-98" transform="rotate(30)"/>
      <line x1="0" y1="-18" x2="0" y2="-98" transform="rotate(45)"/>
      <line x1="0" y1="-18" x2="0" y2="-98" transform="rotate(60)"/>
      <line x1="0" y1="-18" x2="0" y2="-98" transform="rotate(75)"/>
      <line x1="0" y1="-18" x2="0" y2="-98" transform="rotate(90)"/>
      <line x1="0" y1="-18" x2="0" y2="-98" transform="rotate(105)"/>
      <line x1="0" y1="-18" x2="0" y2="-98" transform="rotate(120)"/>
      <line x1="0" y1="-18" x2="0" y2="-98" transform="rotate(135)"/>
      <line x1="0" y1="-18" x2="0" y2="-98" transform="rotate(150)"/>
      <line x1="0" y1="-18" x2="0" y2="-98" transform="rotate(165)"/>
      <line x1="0" y1="-18" x2="0" y2="-98" transform="rotate(180)"/>
      <line x1="0" y1="-18" x2="0" y2="-98" transform="rotate(195)"/>
      <line x1="0" y1="-18" x2="0" y2="-98" transform="rotate(210)"/>
      <line x1="0" y1="-18" x2="0" y2="-98" transform="rotate(225)"/>
      <line x1="0" y1="-18" x2="0" y2="-98" transform="rotate(240)"/>
      <line x1="0" y1="-18" x2="0" y2="-98" transform="rotate(255)"/>
      <line x1="0" y1="-18" x2="0" y2="-98" transform="rotate(270)"/>
      <line x1="0" y1="-18" x2="0" y2="-98" transform="rotate(285)"/>
      <line x1="0" y1="-18" x2="0" y2="-98" transform="rotate(300)"/>
      <line x1="0" y1="-18" x2="0" y2="-98" transform="rotate(315)"/>
      <line x1="0" y1="-18" x2="0" y2="-98" transform="rotate(330)"/>
      <line x1="0" y1="-18" x2="0" y2="-98" transform="rotate(345)"/>
    </g>
  </g>

  <!-- SUBTLE FABRIC LIGHT -->
  <path
    d="
      M170 125
      C340 65 470 150 620 120
      C790 85 930 180 1110 135
      C1190 115 1240 135 1280 150
      L1280 680
      C1100 715 970 635 810 685
      C650 735 500 635 350 685
      C270 710 210 700 170 680
      Z
