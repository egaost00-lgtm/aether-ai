  />

  <!-- GREEN -->
  <path
    d="
      M160 495
      C330 435 470 520 620 490
      C790 455 930 550 1110 505
      C1190 485 1240 505 1290 525
      L1290 700
      C1240 680 1190 660 1110 680
      C930 725 790 630 620 665
      C470 695 330 610 160 670
      Z
    "
